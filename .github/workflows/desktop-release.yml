name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
          - platform: macos-latest
            target: macos
          - platform: ubuntu-24.04
            target: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: Real Calendar Desktop v__VERSION__
          releaseBody: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | **Windows 10+** | `*-setup.exe` (recommended) or `.msi` |
            | **macOS 10.15+** | `.dmg` |
            | **Linux** | `.AppImage` (portable), `.deb`, or `.rpm` |

            **macOS 10.15+:** open the `.dmg`, drag **Real Calendar** to **Applications**, then launch from Applications.

            If macOS blocks the app (unsigned build): **System Settings → Privacy & Security → Open Anyway**, or Control-click the app → **Open** → **Open** once.

            **Windows:** run the `-setup.exe` installer. WebView2 is bundled if missing.

            **In-app updates:** this release includes `latest.json` when `TAURI_SIGNING_PRIVATE_KEY` is configured in repo secrets.

            **Browser-only / older systems:** see `real-calendar-portable.zip` attached below.

            Source: https://github.com/Boobuh/real-calendar
          releaseDraft: true
          args: --config src-tauri/tauri.release.conf.json

  attach-portable:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build portable web zip
        run: make portable

      - name: Attach portable zip to release
        run: gh release upload "${GITHUB_REF_NAME}" build/real-calendar-portable.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
