name: Desktop

on:
  push:
    branches: [main, feat/desktop-tauri]
    paths:
      - 'desktop/**'
      - 'demo/**'
      - 'src/real-calendar@boobuh.github.io/lib/**'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'demo/**'
      - 'src/real-calendar@boobuh.github.io/lib/**'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/desktop.yml'

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build portable web zip
        run: make portable
      - uses: actions/upload-artifact@v4
        with:
          name: real-calendar-portable-web
          path: build/real-calendar-portable.zip

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: linux
          - platform: macos-latest
            target: macos
          - platform: windows-latest
            target: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop app
        working-directory: desktop
        run: npm run build

      - name: Upload Linux bundles
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: real-calendar-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload macOS bundle
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: real-calendar-macos
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Windows bundle
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: real-calendar-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
